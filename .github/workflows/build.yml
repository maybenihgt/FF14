name: Build Mahjong AI Assistant
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build plugin
        run: dotnet build MahjongAI-Assistant/MahjongAI-Assistant.csproj -c Release
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: Mahjong-AI-Assistant-Dalamud-API15
          path: |
            MahjongAI-Assistant/bin/Release/**/MahjongAI-Assistant.dll
            MahjongAI-Assistant/bin/Release/**/MahjongAI-Assistant.json
            MahjongAI-Assistant/bin/Release/**/MahjongAI-Assistant.deps.json
