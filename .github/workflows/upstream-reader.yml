name: Upstream Mahjong Reader Build

on:
  workflow_dispatch:
  push:
    branches: [integration/upstream-auto-reader]

permissions:
  contents: read

jobs:
  build-upstream:
    name: Build upstream reader (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout this integration repository
        uses: actions/checkout@v4
        with:
          path: integration-repo

      - name: Checkout pinned upstream source
        uses: actions/checkout@v4
        with:
          repository: AinaSnow/FFXIV-AutoMahjongSolver
          ref: 6202b32fffa73b48f21050b884b96c55df5945f3
          path: upstream

      - name: Overlay unverified China-client candidate profile
        shell: pwsh
        run: |
          Copy-Item integration-repo/integration/cn-candidate-layout.json upstream/data/layouts/cn-candidate.json

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'

      - name: Install pinned Dalamud build
        shell: pwsh
        working-directory: upstream
        run: ./tools/install-dalamud.ps1

      - name: Install pinned capture runtime
        shell: pwsh
        working-directory: upstream
        run: ./tools/install-deucalion.ps1

      - name: Restore
        working-directory: upstream
        run: dotnet restore Mahjong.Plugin.Dalamud.sln --locked-mode

      # The optional table-score probe uses an Emj FFXIVClientStructs namespace
      # absent from the pinned SDK. Remove only its optional delegate hookup;
      # keep the main addon reader and the source file untouched.
      - name: Disable optional Emj table-score probe hookup
        shell: pwsh
        working-directory: upstream
        run: |
          $file = 'Mahjong.Plugin.Dalamud/Plugin.cs'
          $source = Get-Content $file -Raw
          $old = '            tableScores: EmjTableReader.ReadPoints);'
          if (-not $source.Contains($old)) { throw 'Expected optional EmjTableReader hookup was not found.' }
          $source = $source.Replace($old, '            tableScores: null);')
          Set-Content -Path $file -Value $source -NoNewline
          Remove-Item 'Mahjong.Plugin.Dalamud/GameState/EmjTableReader.cs' -Force

      - name: Harden Mahjong call-prompt detection and safe fallback
        shell: pwsh
        working-directory: upstream
        run: |
          $variant = 'Mahjong.Plugin.Dalamud/GameState/Variants/BaseEmjVariant.cs'
          $source = Get-Content $variant -Raw
          $oldPrompt = '        if (isCallPromptState && callModalVisible)'
          $newPrompt = '        bool atkHasCallLabel = atkValues.Count > 0 && ScanButtonLabels(atkValues, profile.AtkValues.ButtonLabelScanLimit).HasAnyAcceptOffer;' + "`n" + '        if (isCallPromptState && (callModalVisible || atkHasCallLabel))'
          if (-not $source.Contains($oldPrompt)) { throw 'Call-prompt gate not found in BaseEmjVariant.cs' }
          $source = $source.Replace($oldPrompt, $newPrompt)
          $oldRows = '            if (listWidgetLabels is not null)'
          $newRows = '            if (listWidgetLabels is { Count: > 0 })'
          if (-not $source.Contains($oldRows)) { throw 'Call-list fallback gate not found in BaseEmjVariant.cs' }
          $source = $source.Replace($oldRows, $newRows)
          $oldLog = '        bool isPrompt = stateCode == profile.StateCodes.CallPrompt && (legal.Flags & promptFlags) != 0;'
          $newLog = '        bool isPrompt = (stateCode == profile.StateCodes.CallPrompt || stateCode == profile.StateCodes.CallPromptList) && (legal.Flags & promptFlags) != 0;'
          if (-not $source.Contains($oldLog)) { throw 'Call-prompt diagnostic gate not found in BaseEmjVariant.cs' }
          $source = $source.Replace($oldLog, $newLog)
          Set-Content -Path $variant -Value $source -NoNewline

          $auto = 'Mahjong.Plugin.Dalamud/Actions/AutoPlayLoop.cs'
          $source = Get-Content $auto -Raw
          $pattern = '(?m)^            var fallback = forceSafePass\r?\n                \? ActionChoice\.Pass\("pass: no authoritative opponent discard"\)\r?\n                : plugin\.Aggregator\.Choose\(plugin\.MortalBridge\.NormalizeForLocalFallback\(snapshot\)\);'
          $replacement = @"
            if (forceSafePass)
            {
                // Do not click Pass when a live UI reaction is not corroborated by server state.
                // Stop automation and leave the reaction window to the player.
                hasMortalWait = false;
                choice = ActionChoice.Pass("no authoritative opponent discard; manual reaction required");
                LastActionDescription = "automation safety stop: opponent reaction lacks authoritative discard; manual click required";
                log.Warning($"[AutoPlayLoop] {LastActionDescription}");
                plugin.ConfigService.Update(c => c with { AutomationArmed = false, ContinuousCollection = false });
                return false;
            }
            var fallback = plugin.Aggregator.Choose(plugin.MortalBridge.NormalizeForLocalFallback(snapshot));
          "@
          $updated = [regex]::Replace($source, $pattern, [System.Text.RegularExpressions.MatchEvaluator]{ param($m) $replacement }, 1)
          if ($updated -eq $source) { throw 'Mortal safe-pass fallback pattern did not match AutoPlayLoop.cs' }
          $source = $updated
          Set-Content -Path $auto -Value $source -NoNewline

      - name: Prefer visible legal win actions and classify localized win label
        shell: pwsh
        working-directory: upstream
        run: |
          $variant = 'Mahjong.Plugin.Dalamud/GameState/Variants/BaseEmjVariant.cs'
          $source = Get-Content $variant -Raw
          $oldScan = '        var labels = ScanButtonLabels(atkValues, scanLimit: profile.AtkValues.ButtonLabelScanLimit);'
          $newScan = $oldScan + "`n" +
            '        // Generic Chinese "胡/胡牌/和牌" labels are stored under Ron aliases.' + "`n" +
            '        // A 3n+2 concealed hand is our draw and must classify that offer as Tsumo.' + "`n" +
            '        if (hand.Count > 0 && hand.Count % 3 == 2 && labels.OffersRon)' + "`n" +
            '        {' + "`n" +
            '            labels.OffersRon = false;' + "`n" +
            '            labels.OffersTsumo = true;' + "`n" +
            '        }' + "`n" +
            '        else if (hand.Count > 0 && hand.Count % 3 == 1)' + "`n" +
            '            labels.OffersTsumo = false;'
          if (-not $source.Contains($oldScan)) { throw 'Button-label scan insertion point not found.' }
          $source = $source.Replace($oldScan, $newScan)

          $methodMarker = '    private LegalActions BuildCallPromptLegalFromListItems('
          $methodAt = $source.IndexOf($methodMarker)
          if ($methodAt -lt 0) { throw 'BuildCallPromptLegalFromListItems method not found.' }
          $tail = $source.Substring($methodAt)
          $anchor = '        var pons = new List<MeldCandidate>();'
          $insertAt = $tail.IndexOf($anchor)
          if ($insertAt -lt 0) { throw 'Call-list candidate insertion point not found.' }
          $insert = '        // Classify generic CN win labels ("胡/胡牌/和牌") using the concealed-hand shape.' + "`n" +
            '        if (hand.Count > 0 && hand.Count % 3 == 2 && (flags & ActionFlags.Ron) != 0)' + "`n" +
            '            flags = (flags & ~ActionFlags.Ron) | ActionFlags.Tsumo;' + "`n" +
            '        else if (hand.Count > 0 && hand.Count % 3 == 1 && (flags & ActionFlags.Tsumo) != 0)' + "`n" +
            '            flags = (flags & ~ActionFlags.Tsumo) | ActionFlags.Ron;' + "`n" + "`n"
          $source = $source.Substring(0, $methodAt) + $tail.Insert($insertAt, $insert)
          Set-Content -Path $variant -Value $source -NoNewline

          $auto = 'Mahjong.Plugin.Dalamud/Actions/AutoPlayLoop.cs'
          $source = Get-Content $auto -Raw
          $methodWin = '    private bool TryChoose(StateSnapshot snapshot, out ActionChoice choice)'
          $methodAt = $source.IndexOf($methodWin)
          if ($methodAt -lt 0) { throw 'TryChoose method not found.' }
          $prefix = $source.Substring(0, $methodAt)
          $tail = $source.Substring($methodAt)
          $anchorWin = '        if (plugin.MortalBridge.Enabled && !plugin.MortalBridge.CurrentHandQuarantined)'
          $anchorAt = $tail.IndexOf($anchorWin)
          if ($anchorAt -lt 0) { throw 'TryChoose Mortal fallback insertion point not found.' }
          $forceWin = '        // The live game UI has already exposed a legal win action. Do not wait for Mortal.' + "`n" +
            '        if (snapshot.Legal.Can(ActionFlags.Tsumo))' + "`n" +
            '        {' + "`n" +
            '            choice = ActionChoice.DeclareTsumo("game UI exposed a legal Tsumo action");' + "`n" +
            '            hasMortalWait = false;' + "`n" +
            '            plugin.Aggregator.PublishLocalExecution(snapshot, choice, "terminal-guard");' + "`n" +
            '            return true;' + "`n" +
            '        }' + "`n" +
            '        if (snapshot.Legal.Can(ActionFlags.Ron))' + "`n" +
            '        {' + "`n" +
            '            choice = ActionChoice.DeclareRon("game UI exposed a legal Ron action");' + "`n" +
            '            hasMortalWait = false;' + "`n" +
            '            plugin.Aggregator.PublishLocalExecution(snapshot, choice, "terminal-guard");' + "`n" +
            '            return true;' + "`n" +
            '        }' + "`n" + "`n"
          $tail = $tail.Insert($anchorAt, $forceWin)
          $source = $prefix + $tail
          Set-Content -Path $auto -Value $source -NoNewline

      - name: Apply privacy-safe defaults and migrate existing settings
        shell: pwsh
        working-directory: upstream
        run: |
          $config = 'Mahjong.Plugin.Dalamud/Configuration.cs'
          $source = Get-Content $config -Raw
          $oldVersion = 'public const int CurrentSchemaVersion = 3;'
          if (-not $source.Contains($oldVersion)) { throw 'Configuration schema version 3 marker not found.' }
          $source = $source.Replace($oldVersion, 'public const int CurrentSchemaVersion = 4;')
          $oldTraining = 'public bool RetainTrainingData { get; init; } = true;'
          if (-not $source.Contains($oldTraining)) { throw 'Training data default marker not found.' }
          $source = $source.Replace($oldTraining, 'public bool RetainTrainingData { get; init; } = false;')
          Set-Content -Path $config -Value $source -NoNewline

          $plugin = 'Mahjong.Plugin.Dalamud/Plugin.cs'
          $source = Get-Content $plugin -Raw
          $oldMigrator = '            new ConfigMigratorV2ToV3(),'
          if (-not $source.Contains($oldMigrator)) { throw 'Config migrator registration marker not found.' }
          $source = $source.Replace($oldMigrator, $oldMigrator + "`n" + '            new ConfigMigratorV3ToV4(),')
          Set-Content -Path $plugin -Value $source -NoNewline

          $migration = @'
          using Mahjong.Plugin.Game;

          namespace Mahjong.Plugin.Dalamud.Composition;

          /// <summary>Disables optional packet, memory and training collection, and experimental search for the CN candidate build.</summary>
          internal sealed class ConfigMigratorV3ToV4 : IConfigMigrator<Configuration>
          {
              public int FromVersion => 3;
              public int ToVersion => 4;

              public Configuration Migrate(Configuration input) => input with
              {
                  Version = ToVersion,
                  DebugAutoPacketLogging = false,
                  MemoryDumpsEnabled = false,
                  RetainTrainingData = false,
                  EnhancedStrategy = false,
                  EnhancedShadowOnly = true,
              };
          }
          '@
          Set-Content -Path 'Mahjong.Plugin.Dalamud/Composition/ConfigMigratorV3ToV4.cs' -Value $migration

      - name: Keep actionable game prompts for manual user selection
        shell: pwsh
        working-directory: upstream
        run: |
          $dispatcher = 'Mahjong.Plugin.Dalamud/Actions/InputDispatcher.cs'
          $source = Get-Content $dispatcher -Raw
          $anchorMethod = '    public unsafe bool IsCallPromptVisible()'
          $helper = @'
              /// <summary>True only when the live modal rows contain a recognized action/pass label. This lets automation pause for the user's manual choice without confusing a post-call discard list for a decision prompt.</summary>
              public unsafe bool HasManualChoicePrompt()
              {
                  if (!addon.TryGet(out var unit, out _) || !unit->IsVisible)
                      return false;

                  LastCallOptions = CallPromptReader.Read(unit, CallModalHostNodeId, CallModalShellNodeId);
                  foreach (var option in LastCallOptions)
                  {
                      if (!option.Enabled)
                          continue;
                      if (LayoutActionLabelMatcher.IsAcceptAction(option.Label, ActionLabels)
                          || LayoutActionLabelMatcher.IsPass(option.Label, ActionLabels))
                          return true;
                  }
                  return false;
              }

          '@
          if (-not $source.Contains($anchorMethod)) { throw 'InputDispatcher call-prompt visibility method not found.' }
          $source = $source.Replace($anchorMethod, $helper + $anchorMethod)
          Set-Content -Path $dispatcher -Value $source -NoNewline

          $auto = 'Mahjong.Plugin.Dalamud/Actions/AutoPlayLoop.cs'
          $source = Get-Content $auto -Raw
          $anchorObserve = '        LastObservedState = state;' + "`n" + '        LastObservedHandCount = context.Hand;' + "`n" + "`n" + '        if (state == ChiVariantSelectStateCode)'
          $insertObserve = @'
                  LastObservedState = state;
                  LastObservedHandCount = context.Hand;

                  // User preference: normal tile discards may be automated, but action menus
                  // (Riichi/Pass, Chi/Pon/Kan, Ron/Tsumo) remain under manual control.
                  if (plugin.Dispatcher.HasManualChoicePrompt()
                      || (state == ChiVariantSelectStateCode && plugin.Dispatcher.IsCallPromptVisible()))
                  {
                      hasMortalWait = false;
                      fsm.ClearContext();
                      LastActionDescription = "manual action prompt visible; waiting for user selection";
                      EmitSkipReason(LastActionDescription, state, context.Hand, (int)snap.Legal.Flags);
                      return;
                  }

                  if (state == ChiVariantSelectStateCode)
          '@
          if (-not $source.Contains($anchorObserve)) { throw 'AutoPlayLoop observation insertion point not found.' }
          $source = $source.Replace($anchorObserve, $insertObserve)

          $anchorDiscard = '            int currentState = ReadStateCode();' + "`n" + '            bool isTerminalWin = snap is not null'
          $insertDiscard = @'
                      int currentState = ReadStateCode();
                      if (plugin.Dispatcher.HasManualChoicePrompt())
                      {
                          LastActionDescription = "manual action prompt appeared before discard; waiting for user selection";
                          return;
                      }
                      bool isTerminalWin = snap is not null
          '@
          if (-not $source.Contains($anchorDiscard)) { throw 'ScheduleDiscard guard insertion point not found.' }
          $source = $source.Replace($anchorDiscard, $insertDiscard)

          $anchorCall = '            int currentState = ReadStateCode();' + "`n" + '            if (snap is null)'
          $insertCall = @'
                      int currentState = ReadStateCode();
                      if (plugin.Dispatcher.HasManualChoicePrompt())
                      {
                          LastActionDescription = "manual action prompt appeared before call decision; waiting for user selection";
                          hasMortalWait = false;
                          return;
                      }
                      if (snap is null)
          '@
          if (-not $source.Contains($anchorCall)) { throw 'ScheduleCallDecision guard insertion point not found.' }
          $source = $source.Replace($anchorCall, $insertCall)
          Set-Content -Path $auto -Value $source -NoNewline

      - name: Build plugin
        working-directory: upstream
        run: dotnet build Mahjong.Plugin.Dalamud/Mahjong.Plugin.Dalamud.csproj --configuration Release --no-restore

      - name: Upload plugin package
        uses: actions/upload-artifact@v4
        with:
          name: DomanMahjongSolver-China-Candidate
          path: upstream/Mahjong.Plugin.Dalamud/bin/Release/Mahjong.Plugin.Dalamud/latest.zip
          if-no-files-found: error

      - name: Upload corresponding source and integration notes
        uses: actions/upload-artifact@v4
        with:
          name: DomanMahjongSolver-Corresponding-Source
          path: |
            upstream/
            integration-repo/integration/
          if-no-files-found: warn
          retention-days: 30
